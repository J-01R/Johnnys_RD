[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defensive-keylogger-analysis-lab"
version = "0.1.0"
description = "Controlled Windows defensive keylogger analysis lab using synthetic telemetry."
requires-python = ">=3.11"
dependencies = [
    "psutil>=6.0,<8.0",
    "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
