[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-integrity-monitoring"
version = "1.0.0"
description = "Defensive file integrity monitoring system using SHA-256 verification."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Jonatan \"Johnny\" Rassekhnia" }
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=9.0,<10.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"